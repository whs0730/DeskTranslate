<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>DeskTranslate</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M15 4H7a3 3 0 0 0-3 3v8"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M8 12h8m-8 4h5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.8 2.6-2.6.6L4 9l1.7 2v2L4 15l1.6 2.8 2.6.6L9 21h6l.8-2.6 2.6-.6L20 15l-1.7-2v-2L20 9l-1.6-2.8-2.6-.6L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h1m3 0h1m3 0h2M7 13h1m3 0h1m3 0h2m-9 3h8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 3 4H6l3-4ZM12 13v8"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
  </svg>

  <main class="app" aria-label="DeskTranslate 英汉翻译">
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <div class="mode-switch" role="group" aria-label="功能模式">
          <button type="button" class="mode-option" data-mode="translation" aria-pressed="true">翻译</button>
          <button type="button" class="mode-option" data-mode="subtitles" aria-pressed="false">字幕</button>
        </div>
        <span class="brand-name">DeskTranslate</span>
      </div>
      <span class="service" id="service"><span class="service-dot"></span><span id="service-text">就绪</span></span>
      <span class="service subtitle-service" id="subtitle-service" hidden><span class="service-dot"></span><span id="subtitle-service-text">已停止</span></span>
      <div class="window-controls">
        <button class="icon-button pin-button" id="pin" aria-label="置顶窗口" aria-pressed="false" title="置顶窗口"><svg><use href="#i-pin"/></svg></button>
        <button class="icon-button" id="minimize" aria-label="隐藏到托盘" title="隐藏到托盘"><span class="minus"></span></button>
        <button class="icon-button close-button" id="close" aria-label="关闭并驻留托盘" title="关闭并驻留托盘"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <section class="workspace" id="translation-workspace" aria-label="翻译">
      <div class="language-row">
        <div class="direction-tabs" data-glass-surface role="group" aria-label="翻译方向">
          <button class="direction active" data-direction="auto" aria-pressed="true">自动</button>
          <button class="direction" data-direction="en_to_zh" aria-pressed="false">英 → 中</button>
          <button class="direction" data-direction="zh_to_en" aria-pressed="false">中 → 英</button>
        </div>
        <button class="icon-button" id="swap" data-glass-surface aria-label="交换翻译方向" title="交换翻译方向"><svg><use href="#i-swap"/></svg></button>
      </div>

      <div class="editor-pane">
        <label class="section-label" for="input" id="source-label">原文<span>自动识别语言</span></label>
        <textarea id="input" placeholder="输入文字，让表达更轻松。" spellcheck="false" aria-describedby="counter" autofocus></textarea>
        <div class="editor-actions">
          <div class="input-tools">
            <button class="text-button" id="paste"><svg><use href="#i-paste"/></svg>粘贴</button>
            <button class="text-button" id="clear">清空</button>
            <span class="counter" id="counter">0 / 3000</span>
          </div>
          <button class="translate-button" id="translate" data-glass-surface aria-label="翻译"><span>翻译</span><svg><use href="#i-arrow"/></svg></button>
        </div>
      </div>

      <div class="divider"></div>

      <section class="result-pane" aria-label="译文" aria-busy="false" id="result-pane">
        <div class="result-heading">
          <h1 class="section-label">译文<span id="result-direction"></span></h1>
          <button class="text-button" id="copy" disabled><svg><use href="#i-copy"/></svg><span id="copy-label">复制</span></button>
        </div>
        <div class="result-scroll" tabindex="0" aria-label="翻译结果">
          <p class="result empty" id="result">翻译结果会显示在这里</p>
          <p class="phonetic" id="phonetic" hidden></p>
          <p class="alternatives" id="alternatives" hidden></p>
          <div class="dictionary" id="dictionary" hidden></div>
        </div>
        <p class="status" id="status" role="status">Enter 翻译，Ctrl + Enter 换行</p>
      </section>
    </section>

    <section class="subtitle-workspace" id="subtitle-workspace" aria-label="字幕" hidden>
      <div class="subtitle-frame">
        <div class="subtitle-heading"><span>实时字幕</span><span class="subtitle-badge" id="subtitle-status" role="status">已停止</span></div>
        <p id="subtitle-message" class="subtitle-message" role="status" hidden></p>
        <div class="subtitle-lines" id="subtitle-lines" aria-label="字幕内容">
          <div class="subtitle-empty" id="subtitle-empty"><p>点击开始显示字幕</p><span>英文识别在本机，翻译使用当前服务</span></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <button type="button" class="shortcut-hint" id="shortcut" title="点击设置快捷键"><span id="hotkey">Ctrl + Alt + T</span></button>
      <div class="subtitle-actions" id="subtitle-actions" hidden>
        <select id="subtitle-device" aria-label="系统播放设备"><option value="">正在查找播放设备…</option></select>
        <button type="button" id="subtitle-toggle" class="subtitle-toggle" disabled>开始字幕</button>
        <button type="button" id="subtitle-clear" class="text-button" aria-label="清空字幕">清空</button>
      </div>
      <div class="footer-right"><span class="language-pair" id="language-pair">EN <span>⇄</span> 中</span><button class="settings-button icon-button" id="settings" data-glass-surface aria-label="设置" title="设置"><svg><use href="#i-settings"/></svg></button></div>
    </footer>
    <div class="resize-edge n" data-resize="n"></div><div class="resize-edge s" data-resize="s"></div>
    <div class="resize-edge w" data-resize="w"></div><div class="resize-edge e" data-resize="e"></div>
    <div class="resize-corner nw" data-resize="nw"></div><div class="resize-corner ne" data-resize="ne"></div>
    <div class="resize-corner sw" data-resize="sw"></div><div class="resize-corner se" data-resize="se"></div>
  </main>

</body>
</html>
