[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktranslate"
version = "0.2.5"
description = "A compact English-Chinese desktop translator for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow==12.3.0",
    "pystray==0.19.5",
]

[project.gui-scripts]
desktranslate = "desktranslate.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
