[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktranslate"
version = "0.3.0"
description = "A compact English-Chinese desktop translator for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow==12.3.0",
    "pystray==0.19.5",
    "pywebview==6.2.1",
    "PyAudioWPatch==0.2.12.9",
    "sherpa-onnx==2.0.2",
    "numpy==2.5.5",
]

[project.gui-scripts]
desktranslate = "desktranslate.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktranslate = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
